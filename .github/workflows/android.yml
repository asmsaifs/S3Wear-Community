# Android companion app: ktlint, detekt, Android Lint, unit tests, debug APK.
# docs/08-quality-ci-release.md §3.
name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "protocol/**"
      - ".editorconfig"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "protocol/**"
      - ".editorconfig"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, assemble
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle and validates the wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: ktlint, detekt, lint, unit tests, assembleDebug
        run: ./gradlew ktlintCheck detekt lint test assembleDebug

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports-${{ github.sha }}
          path: android/**/build/reports/

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
